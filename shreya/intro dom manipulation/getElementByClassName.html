<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: red;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
   <div class ="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <button oneclick="magic()">Do the magic</button>
   </div>
    <script>
        function magic(){
            let divs = document.getElementByName("div")
            for (element of divs){
                element.innerHTML = element.innerHTML + "<p>atharva is bad boy</p>"
            }
        }
    </script>   
</body>
</html>
