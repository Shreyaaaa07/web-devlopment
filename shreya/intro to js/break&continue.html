<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break and Continue</title>
</head>
<body>
    <script>
        for (let index = 0; index < 10; index++) {
            console.log(index)
            if (index === 5) {
                break; // the loop stop forever
                continue // the loop will skip the current iteration of the loop
            }
            console.log(index)
        }
    </script>
</body>
</html>
